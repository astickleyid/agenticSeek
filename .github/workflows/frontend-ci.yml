name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/agentic-seek-front/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend/agentic-seek-front
        npm ci

    - name: Build
      run: |
        cd frontend/agentic-seek-front
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/agentic-seek-front/build
        retention-days: 7
